version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - area:security
    cooldown:
      default-days: 7
    ignore:
      # eslint 10 is not supported by @salesforce/eslint-config-lwc 4.x (peer
      # eslint ^9) and breaks the @babel/eslint-parser peer range (#131). Drop
      # this entry once eslint-config-lwc supports eslint 10.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
    groups:
      # The eslint toolchain packages constrain each other's peer ranges, so
      # separate PRs fail `npm ci` with ERESOLVE (#126, #131). Keep them in one
      # PR, including major updates.
      eslint-toolchain:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "@lwc/eslint-plugin-*"
          - "@salesforce/eslint-*"
          - "@babel/core"
          - "@babel/eslint-parser"
          - "globals"
      npm-minor-patch:
        exclude-patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "@lwc/eslint-plugin-*"
          - "@salesforce/eslint-*"
          - "@babel/core"
          - "@babel/eslint-parser"
          - "globals"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # Workflows live in /.github/workflows; local composite actions need
    # their own directories to be scanned.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - area:security
    cooldown:
      default-days: 7
    groups:
      # These three actions are also used in scratch-org-validation.yml, so a
      # PR touching them triggers that workflow (see ADR 0006). Keeping them in
      # one group limits this to one scratch org per update PR. Major versions
      # are not grouped and arrive as separate PRs.
      actions-scratch-org:
        patterns:
          - "actions/checkout"
          - "actions/setup-node"
          - "actions/upload-artifact"
        update-types:
          - minor
          - patch
      actions-other:
        patterns:
          - "*"
        exclude-patterns:
          - "actions/checkout"
          - "actions/setup-node"
          - "actions/upload-artifact"
        update-types:
          - minor
          - patch

  # Python (pip) for integration-server/ is added in M4 (#58).
