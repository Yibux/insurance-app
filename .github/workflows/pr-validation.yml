name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Lint, format and LWC Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # step timings for the duration report
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dependency audit (npm audit)
        # Fails on high and critical advisories in the full dependency tree
        # (dev dependencies included: they run in CI and on developer machines).
        run: npm audit --audit-level=high

      - name: ESLint (LWC/Aura)
        run: npm run lint

      - name: Prettier check
        run: npm run prettier:verify

      - name: LWC Jest
        run: npm run test:unit -- --ci

      - name: CI script unit tests
        run: python3 -m unittest discover --start-directory scripts/ci --pattern "test_*.py" --buffer

      - name: Record gate durations
        if: always()
        uses: ./.github/actions/gate-durations
        with:
          job-name: Lint, format and LWC Jest
          artifact-name: gate-durations-static-checks

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read # step timings for the duration report
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Self-test with a canary token
        # Generated at runtime so no fake secret is ever committed.
        run: |
          canary_dir="$RUNNER_TEMP/canary"
          mkdir -p "$canary_dir"
          printf 'token = "ghp_%s"\n' "$(head -c 18 /dev/urandom | od -An -tx1 | tr -d ' \n')" > "$canary_dir/config.txt"
          if gitleaks dir "$canary_dir" --no-banner --redact --log-level error > /dev/null; then
            echo "::error::gitleaks did not detect the canary token"
            exit 1
          fi
          echo "Canary detected as expected."

      - name: Scan full git history
        run: |
          mkdir -p reports
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path reports/gitleaks.sarif

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('reports/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks

      - name: Upload gitleaks report
        if: always() && hashFiles('reports/gitleaks.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: reports/gitleaks.sarif
          retention-days: 3

      - name: Record gate durations
        if: always()
        uses: ./.github/actions/gate-durations
        with:
          job-name: Secret scan (gitleaks)
          artifact-name: gate-durations-gitleaks

  code-analyzer:
    name: Salesforce Code Analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read # step timings for the duration report
    env:
      SF_CLI_VERSION: 2.156.8
      CODE_ANALYZER_VERSION: 5.16.0
      SF_DISABLE_TELEMETRY: true
      SF_AUTOUPDATE_DISABLE: true
      # Fail on Critical (1) and High (2) violations.
      SEVERITY_THRESHOLD: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global --ignore-scripts "@salesforce/cli@${SF_CLI_VERSION}"
          sf plugins install "code-analyzer@${CODE_ANALYZER_VERSION}"
          sf plugins
          java -version

      - name: Run Code Analyzer
        run: |
          mkdir -p reports
          sf code-analyzer run \
            --workspace force-app \
            --rule-selector "pmd:Recommended" \
            --rule-selector "eslint:Recommended" \
            --rule-selector "retire-js" \
            --rule-selector "flow" \
            --rule-selector "sfge" \
            --rule-selector "regex:ApexNoWithoutSharing" \
            --severity-threshold "$SEVERITY_THRESHOLD" \
            --output-file reports/code-analyzer.sarif \
            --output-file reports/code-analyzer.html \
            --output-file reports/code-analyzer.json \
            --view table

      - name: Code Analyzer summary
        if: always()
        run: python3 scripts/ci/gate_report.py code-analyzer reports/code-analyzer.json --severity-threshold "$SEVERITY_THRESHOLD"

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('reports/code-analyzer.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/code-analyzer.sarif
          category: salesforce-code-analyzer

      - name: Upload report
        if: always() && hashFiles('reports/code-analyzer.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-analyzer-report
          path: reports/
          retention-days: 14

      - name: Record gate durations
        if: always()
        uses: ./.github/actions/gate-durations
        with:
          job-name: Salesforce Code Analyzer
          artifact-name: gate-durations-code-analyzer
