name: Scratch org validation

on:
  pull_request:
    branches: [main]
    paths:
      - "force-app/**"
      - "config/**"
      - "sfdx-project.json"
      - "scripts/ci/check_coverage.py"
      - "scripts/ci/gate_report.py"
      - "scripts/ci/delta_plan.py"
      - ".github/actions/gate-durations/**"
      - ".github/workflows/scratch-org-validation.yml"

permissions:
  contents: read

# A newer push to the same PR cancels the running validation; the cleanup
# steps still run because they use `always()`.
concurrency:
  group: scratch-org-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SF_CLI_VERSION: 2.156.8
  SF_DISABLE_TELEMETRY: true
  SF_AUTOUPDATE_DISABLE: true
  COVERAGE_THRESHOLD: 75

jobs:
  deploy:
    name: Deploy to scratch org
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # step timings for the duration report
    environment: devhub
    # One scratch org job at a time across the repository: Developer Edition
    # allows 3 active and 6 new scratch orgs per day.
    concurrency:
      group: devhub-scratch-org
      cancel-in-progress: false
    env:
      SCRATCH_ALIAS: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan deployment (delta or full)
        id: plan
        # Any failure of this step leaves `mode` unset, which the deploy steps
        # treat as "full" (ADR 0011). The base commit is a SHA from the event
        # payload, validated by the script; no free-text PR field is used.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/delta_plan.py --paths-file "$RUNNER_TEMP/delta/paths.nul"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: |
          npm install --global --ignore-scripts "@salesforce/cli@${SF_CLI_VERSION}"
          sf --version

      - name: Authenticate to Dev Hub (JWT Bearer)
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          umask 077
          printf '%s\n' "$SF_JWT_KEY" > "$RUNNER_TEMP/devhub.key"
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/devhub.key" \
            --username "$SF_USERNAME" \
            --alias devhub \
            --set-default-dev-hub > /dev/null
          rm -f "$RUNNER_TEMP/devhub.key"
          echo "Authenticated to Dev Hub."

      - name: Create scratch org
        env:
          # The signup service cannot replicate an External Client App into a
          # new scratch org (error C-1016), so signup uses the built-in CLI
          # connected app. The Dev Hub itself is still accessed via our ECA.
          SF_SCRATCH_SIGNUP_CONNECTED_APP: PlatformCLI
          SF_SCRATCH_SIGNUP_CALLBACK_URL: http://localhost:1717/OauthRedirect
        run: |
          sf org create scratch \
            --definition-file config/project-scratch-def.json \
            --alias "$SCRATCH_ALIAS" \
            --target-dev-hub devhub \
            --duration-days 1 \
            --wait 20 > /dev/null
          username=$(sf org display --target-org "$SCRATCH_ALIAS" --json | jq -r '.result.username')
          echo "SF_SITE_ADMIN_USERNAME=${username}" >> "$GITHUB_ENV"
          echo "Scratch org ${SCRATCH_ALIAS} created."

      - name: Deploy source (delta)
        id: deploy_delta
        if: steps.plan.outputs.mode == 'delta'
        # A delta deploy into a fresh org can fail only because an unchanged
        # dependency is missing; the full deploy below then gives the verdict.
        continue-on-error: true
        run: |
          mapfile -d '' -t delta_paths < "$RUNNER_TEMP/delta/paths.nul"
          source_args=()
          for path in "${delta_paths[@]}"; do source_args+=(--source-dir "$path"); done
          echo "Deploying ${#delta_paths[@]} changed file(s)."
          sf project deploy start --target-org "$SCRATCH_ALIAS" "${source_args[@]}" --wait 30

      - name: Deploy source (full)
        id: deploy_full
        if: steps.plan.outputs.mode != 'delta' || steps.deploy_delta.outcome != 'success'
        env:
          DELTA_OUTCOME: ${{ steps.deploy_delta.outcome }}
        run: |
          if [ "$DELTA_OUTCOME" = "failure" ]; then
            echo "::warning::Delta deploy failed; falling back to a full deploy."
          fi
          sf project deploy start --target-org "$SCRATCH_ALIAS" --wait 30

      - name: Deployment mode
        id: mode
        env:
          DELTA_OUTCOME: ${{ steps.deploy_delta.outcome }}
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
        run: |
          if [ "$DELTA_OUTCOME" = "success" ]; then final=delta; else final=full; fi
          echo "final=${final}" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment: ${final}"
            echo
            echo "- plan: ${PLAN_MODE:-full (planner failed)}; ${PLAN_REASON:-no reason recorded}"
            if [ "$final" = "delta" ]; then
              echo "- Apex tests and the coverage gate were skipped: the delta contains only UI metadata that Apex tests cannot depend on (ADR 0011)."
            fi
            if [ "$PLAN_MODE" = "delta" ] && [ "$final" = "full" ]; then
              echo "- delta deploy failed, so the full deploy ran (fallback)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Apex tests
        id: apex
        if: steps.mode.outputs.final == 'full'
        run: |
          # Run only our test classes: RunLocalTests would also run the
          # Experience Cloud controller tests the platform adds to the org.
          mapfile -t test_classes < <(grep -rli --include='*.cls' '@istest' force-app | xargs -r -n1 basename | sed 's/\.cls$//' | sort)
          if [ "${#test_classes[@]}" -eq 0 ]; then
            echo "No Apex test classes in force-app; skipping."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          results="$RUNNER_TEMP/apex-results"
          mkdir -p "$results"
          echo "ran=true" >> "$GITHUB_OUTPUT"
          echo "Test classes: ${test_classes[*]}"
          class_args=()
          for name in "${test_classes[@]}"; do class_args+=(--class-names "$name"); done
          set +e
          sf apex run test \
            --target-org "$SCRATCH_ALIAS" \
            "${class_args[@]}" \
            --code-coverage \
            --output-dir "$results" \
            --wait 30 \
            --json > "$results/sf-apex-run-test.json"
          rc=$?
          set -e
          # 100 means failing tests; the coverage gate reports them.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 100 ]; then
            jq -r '.message // empty' "$results/sf-apex-run-test.json"
            exit "$rc"
          fi

      - name: Coverage gate
        if: steps.apex.outputs.ran == 'true'
        run: python3 scripts/ci/check_coverage.py "$RUNNER_TEMP/apex-results/sf-apex-run-test.json" --source-dir force-app

      - name: Apex test results summary
        if: always() && steps.apex.outputs.ran == 'true'
        run: python3 scripts/ci/gate_report.py apex-tests "$RUNNER_TEMP/apex-results/sf-apex-run-test.json"

      - name: Upload Apex test results
        if: always() && steps.apex.outputs.ran == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apex-test-results
          path: ${{ runner.temp }}/apex-results
          retention-days: 14

      - name: Delete scratch org
        if: always()
        run: |
          if sf org display --target-org "$SCRATCH_ALIAS" > /dev/null 2>&1; then
            sf org delete scratch --target-org "$SCRATCH_ALIAS" --no-prompt
          else
            echo "No scratch org to delete."
          fi

      - name: Remove credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/devhub.key"
          sf org logout --all --no-prompt > /dev/null 2>&1 || true

      - name: Record gate durations
        if: always()
        uses: ./.github/actions/gate-durations
        with:
          job-name: Deploy to scratch org
          artifact-name: gate-durations-scratch-org
